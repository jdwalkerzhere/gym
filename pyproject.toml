[project]
name = "product-gym"
version = "0.1.0"
description = "A file-based, Codex-authored technical product gym"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.scripts]
gym = "gym.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
